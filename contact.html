<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - India Calculator Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: linear-gradient(135deg, #4facfe, #00c6ff);
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin-top: 10px;
      font-size: 16px;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    p {
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
    }

    textarea {
      height: 130px;
      resize: vertical;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2196f3;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1976d2;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      text-decoration: none;
      color: #1976d2;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>Contact Us</h1>
  <p>India Calculator Hub</p>
</header>

<div class="container">

  <div class="box">

    <h2>Get in Touch</h2>

    <p>
      If you have any questions, suggestions, feedback, or find any issue
      with our calculators, feel free to contact us.
    </p>

    <label>Your Name</label>
    <input type="text" placeholder="Enter your name">

    <label>Your Email</label>
    <input type="email" placeholder="Enter your email">

    <label>Your Message</label>
    <textarea placeholder="Write your message"></textarea>

    <button onclick="alert('Thank you for contacting India Calculator Hub!')">
      Send Message
    </button>

    <a class="back" href="index.html">← Back to Home</a>

  </div>

</div>

<footer>
  © 2026 India Calculator Hub. All Rights Reserved.
</footer>

</body>
</html>
